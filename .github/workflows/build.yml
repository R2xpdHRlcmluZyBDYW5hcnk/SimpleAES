name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        run: >-
          wails build -clean
          -platform windows/${{ matrix.goarch }}
          -webview2 embed
          -o SimpleAES-${{ matrix.goarch }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SimpleAES-${{ matrix.goarch }}
          path: build/bin/SimpleAES-${{ matrix.goarch }}.exe
