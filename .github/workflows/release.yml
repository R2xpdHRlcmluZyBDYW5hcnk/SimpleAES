name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows resources (icon + version info)
        run: >-
          go-winres simply
          --arch ${{ matrix.goarch }}
          --icon icon.ico
          --manifest gui
          --product-name "SimpleAES"
          --file-description "SimpleAES - A simple AES encryption tool"
          --product-version "${{ github.ref_name }}"
          --file-version "${{ github.ref_name }}"
          --original-filename "SimpleAES-${{ matrix.goarch }}.exe"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build
          -ldflags "-s -w -H windowsgui"
          -o SimpleAES-${{ matrix.goarch }}.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleAES-${{ matrix.goarch }}
          path: SimpleAES-${{ matrix.goarch }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SimpleAES-amd64/SimpleAES-amd64.exe
            artifacts/SimpleAES-arm64/SimpleAES-arm64.exe
          generate_release_notes: true
