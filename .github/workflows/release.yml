name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 缓存目录放进工作区，key 里带上目标架构，避免 amd64 / arm64 互相覆盖编译缓存。
env:
  GOMODCACHE: ${{ github.workspace }}\.gocache\mod
  GOCACHE: ${{ github.workspace }}\.gocache\build

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false

      - name: Cache Go caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\.gocache\mod
            ${{ github.workspace }}\.gocache\build
          key: gocache-${{ runner.os }}-amd64-${{ hashFiles('go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-amd64-

      - name: Add MinGW-w64 to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false

      - name: Cache Go caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\.gocache\mod
            ${{ github.workspace }}\.gocache\build
          key: gocache-${{ runner.os }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ matrix.goarch }}-

      - name: Set up x86_64 toolchain
        if: matrix.goarch == 'amd64'
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Set up aarch64 cross toolchain
        if: matrix.goarch == 'arm64'
        shell: pwsh
        run: |
          # 直接钉死版本，避免用 GitHub API 查最新版时被匿名速率限制打断。
          # 与本地 WSL 构建（wsl-build.sh）使用同一版本。
          $ver = "20260908"
          $zip = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip" -OutFile $zip -UseBasicParsing
          New-Item -ItemType Directory -Force "C:\llvm-mingw" | Out-Null
          tar -xf $zip -C "C:\llvm-mingw"

          $bin = (Get-ChildItem "C:\llvm-mingw" -Recurse -Directory -Filter bin | Select-Object -First 1).FullName
          if (-not (Test-Path (Join-Path $bin "aarch64-w64-mingw32-gcc.exe"))) {
            Get-ChildItem $bin | Select-Object -ExpandProperty Name
            throw "aarch64-w64-mingw32-gcc.exe not found in $bin"
          }
          echo $bin >> $env:GITHUB_PATH
          echo "CC=aarch64-w64-mingw32-gcc" >> $env:GITHUB_ENV

      - name: Generate Windows resources
        run: go generate ./...

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o bin/SimpleAES-${{ matrix.goarch }}.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SimpleAES-${{ matrix.goarch }}
          path: bin/SimpleAES-${{ matrix.goarch }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'preview') }}
          make_latest: ${{ !(contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'preview')) }}
          files: |
            artifacts/SimpleAES-amd64/SimpleAES-amd64.exe
            artifacts/SimpleAES-arm64/SimpleAES-arm64.exe
          generate_release_notes: true
