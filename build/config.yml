version: '3'

info:
  companyName: "Glittering Canary"
  productName: "SimpleAES"
  productIdentifier: "com.glitteringcanary.simpleaes"
  description: "SimpleAES - A simple AES encryption tool"
  copyright: "MIT License"
  comments: "SimpleAES - A simple AES encryption tool"
  version: "0.2.0-beta.2"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
